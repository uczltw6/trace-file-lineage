name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (otherwise build and check only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Confirm the tag matches the declared version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if declared != tag:
              sys.exit(f"tag {tag!r} does not match pyproject version {declared!r}")
          print(f"tag and version agree: {declared}")
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify the built wheel installs and runs
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl
          /tmp/verify/bin/lineage --help
          /tmp/verify/bin/lineage doctor --root .
          /tmp/verify/bin/python -c "import importlib.metadata as m; \
            reqs = m.requires('trace-file-lineage') or []; \
            assert all('extra ==' in r for r in reqs), reqs; \
            print('core stayed dependency-free', m.version('trace-file-lineage'))"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted publishing; no API token stored in the repository.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
