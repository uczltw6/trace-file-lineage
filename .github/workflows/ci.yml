name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check --output-format github .
      - name: Confirm no suppression lacks a reason
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # A bare `# noqa: RULE` hides a finding without saying why. Require a
          # trailing explanation so suppressions stay reviewable.
          pattern = re.compile(r"#\s*noqa:\s*[A-Z]+[0-9,A-Z]*\s*$")
          offenders = []
          for path in pathlib.Path(".").rglob("*.py"):
              if any(part in {".git", ".venv", "build", "dist"} for part in path.parts):
                  continue
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if pattern.search(line):
                      offenders.append(f"{path}:{number}")
          if offenders:
              sys.exit("noqa without an explanation:\n" + "\n".join(offenders))
          print("every suppression carries a reason")
          PY

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install coverage
        run: python -m pip install coverage
      - name: Enable measurement inside subprocesses
        # The CLI tests drive the real entry point as a child process. Without
        # this hook those lines look uncovered and the number is meaningless.
        run: |
          SITE=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "import coverage; coverage.process_startup()" > "$SITE/coverage_subprocess.pth"
      - name: Run the suite under coverage
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          # Absolute, so the per-process data files land here rather than in
          # whatever directory a child process happens to run in. Without this,
          # commands wrapped by `lineage run` drop coverage files into the
          # temporary workspace under test and it counts them as new artifacts.
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py"
          python -m coverage combine
      - name: Enforce the 80% floor
        run: python -m coverage report --fail-under=80

  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Provide a JavaScript engine for the explorer runtime test
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependency-free core
        run: python -m pip install . --no-deps
      - name: Verify installed entry points and dependency contract
        run: |
          python -c "import importlib.metadata as m; import lineage_core; requirements=m.requires('trace-file-lineage') or []; assert all('extra ==' in item for item in requirements); print(lineage_core.__version__)"
          python -m lineage_core doctor --root .
      - name: Unit and scenario tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Cross-platform installed-package smoke test
        run: python tests/cross_platform_smoke.py
      - name: Scenario evaluation summary
        run: python tests/run_scenario_evals.py
      - name: Installed-skill self-test
        run: python skills/trace-file-lineage/scripts/self_test.py
      - name: Validate skill structure
        run: python tests/validate_skill.py

  optional-documents:
    name: Optional documents / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install documented PDF extra and deterministic fixture builders
        run: python -m pip install ".[pdf]" reportlab python-docx
      - name: Real PDF extraction, media, ranking, and degraded-fallback fixtures
        run: python -m unittest tests.optional.test_pdf_ocr_integration.PDFRuntimeIntegrationTests -v
      - name: Cross-platform smoke with optional document dependencies present
        run: python tests/cross_platform_smoke.py

  optional-ocr:
    name: Optional local OCR / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install documented Python extras and fixture builders
        run: python -m pip install ".[pdf,ocr]" reportlab python-docx
      - name: Install ephemeral local OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Real scanned-PDF and PNG OCR fixtures
        run: python -m unittest tests.optional.test_pdf_ocr_integration.OCRRuntimeIntegrationTests -v

  performance:
    name: Incremental performance baseline / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependency-free core
        run: python -m pip install . --no-deps
      - name: Build 1k/10k mixed baselines and enforce post-baseline gates
        run: |
          python tests/benchmark.py
          python tests/performance_gates.py
      - name: Export 10k Obsidian notes twice and verify rename-stable backlinks
        run: python tests/obsidian_scale.py
