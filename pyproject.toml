[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-file-lineage"
version = "0.7.0"
description = "Find out which code, data, or command produced a file — local-first provenance with no server or API key"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "tianyiwei"},
  {name = "Claudia Chen"},
]
maintainers = [
  {name = "tianyiwei"},
  {name = "Claudia Chen"},
]
keywords = [
  "provenance",
  "lineage",
  "data-lineage",
  "artifacts",
  "forensics",
  "reproducibility",
  "ai-agents",
  "developer-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  # No license classifier: PEP 639 supersedes it with the `license` SPDX expression.
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Version Control",
  "Topic :: System :: Archiving",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/uczltw6/trace-file-lineage"
Repository = "https://github.com/uczltw6/trace-file-lineage"
Issues = "https://github.com/uczltw6/trace-file-lineage/issues"
Changelog = "https://github.com/uczltw6/trace-file-lineage/blob/main/CHANGELOG.md"

[project.scripts]
# `lineage` is the documented short form and matches the argparse prog name;
# `trace-file-lineage` stays available as the unambiguous distribution name.
lineage = "lineage_core.cli:main"
trace-file-lineage = "lineage_core.cli:main"

[project.optional-dependencies]
pdf = [
  "pypdf>=5,<7",
  "Pillow>=10",
]
ocr = [
  "Pillow>=10",
]

[tool.setuptools]
package-dir = {"" = "skills/trace-file-lineage/scripts"}

[tool.setuptools.packages.find]
where = ["skills/trace-file-lineage/scripts"]
include = ["lineage_core*"]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
# A focused set: correctness, dead code, import hygiene, likely bug patterns,
# and the security rules that matter for a tool reading untrusted files. Rules
# that merely disagree with this project's deliberate design are left off, with
# the reason recorded, so that a finding here always means something.
select = [
  "F",      # pyflakes: unused imports and variables, undefined names
  "E4", "E7", "E9",  # pycodestyle errors worth failing a build over
  "I",      # import sorting
  "UP",     # pyupgrade: keep syntax current with the declared Python floor
  "B",      # bugbear: likely bugs
  "S",      # bandit: security
  "DTZ",    # naive datetimes
  "SIM",    # simplifiable constructs
  "RUF",    # ruff-specific, notably dead conditionals
  "PL",     # pylint subset
]
ignore = [
  # The scanner, argparse builder, and adapters are legitimately branchy; a
  # complexity cap here would only invite suppressions.
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
  "PLR2004",  # inline thresholds read better than named constants in tests
  "S101",     # assert is how unittest expresses itself
  "SIM108",   # a ternary is not always clearer than if/else
  # Lazy imports ARE the optional-dependency mechanism: PIL, pypdf, and the
  # platform adapters must only be imported when actually present.
  "PLC0415",
  # `lineage run` exists to launch a child process. It always passes an argument
  # array and never requests a shell, which is the safe form these rules ask for.
  "S603", "S607",
  # Non-ASCII characters appear in test fixtures on purpose, to cover
  # normalization and encoding behaviour.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests prepend the skill script directory to sys.path before importing the
# package under test, so imports cannot all sit at the top of the file.
"tests/**" = ["E402"]
"skills/trace-file-lineage/scripts/self_test.py" = ["E402"]
# Every interpolation here is an internal literal fragment or a generated `?`
# placeholder list; user values are always bound as parameters.
"skills/trace-file-lineage/scripts/lineage_core/storage/sqlite_store.py" = ["S608"]
# The explorer's JavaScript lives in string constants, so line length there is
# governed by the JavaScript rather than by Python style.
"skills/trace-file-lineage/scripts/lineage_core/renderers/explorer_assets.py" = ["E501"]

[tool.coverage.run]
# CLI tests drive the real entry point in a subprocess, so measurement has to
# follow child processes or the reported number is meaningless.
source = ["skills/trace-file-lineage/scripts/lineage_core"]
parallel = true
branch = false
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
