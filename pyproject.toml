[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-file-lineage"
version = "0.5.0"
description = "Agent-independent local-first provenance and artifact navigation"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Trace File Lineage Contributors"}]
dependencies = []

[project.scripts]
trace-file-lineage = "lineage_core.cli:main"

[project.optional-dependencies]
pdf = [
  "pypdf>=5,<7",
  "Pillow>=10",
]
ocr = [
  "Pillow>=10",
]

[tool.setuptools]
package-dir = {"" = "skills/trace-file-lineage/scripts"}

[tool.setuptools.packages.find]
where = ["skills/trace-file-lineage/scripts"]
include = ["lineage_core*"]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
target-version = "py311"
line-length = 120
